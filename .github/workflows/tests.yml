name: tests

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  eva:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: paneworks
          skipPush: true
      - name: Package and NixOS module
        run: nix flake check --accept-flake-config --no-update-lock-file --print-build-logs
      - name: Shell, lock and greeter load on the pinned morf
        run: nix develop --accept-flake-config --no-update-lock-file --command sh tools/check.sh
      - name: Specs against the pinned morf
        run: nix develop --accept-flake-config --no-update-lock-file --command sh tools/test.sh
      - name: NixOS module helpers
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s nix/tests
