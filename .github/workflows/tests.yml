name: tests

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  eva:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
        with:
          # morf's cache; a build from source when it does not answer.
          extra_nix_config: |
            extra-substituters = https://cache.bresilla.com/bresilla
            extra-trusted-public-keys = bresilla:zsecaZYIrjCJQS4AuGPmEVU5PRkiMmB/Mds3KaCzTvE=
            connect-timeout = 10
            fallback = true
      - name: Package, helpers and NixOS module
        run: nix flake check --accept-flake-config --no-update-lock-file --print-build-logs
      - name: Shell, lock and greeter load on the pinned morf
        run: nix develop --accept-flake-config --no-update-lock-file --command sh tools/check.sh
      - name: Specs against the pinned morf
        run: nix develop --accept-flake-config --no-update-lock-file --command sh tools/test.sh
      - name: NixOS module helpers
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s nix/tests
      - name: Greeter login conversation
        run: nix develop --accept-flake-config --no-update-lock-file --command lua tools/test-auth.lua
